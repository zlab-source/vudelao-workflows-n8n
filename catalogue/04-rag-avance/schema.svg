<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" rx="12" fill="#F5F2EA"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315C5A"/></marker></defs>
  <g font-size="11" fill="#5E6662" font-weight="bold" letter-spacing="1.5"><text x="24" y="34">INDEXATION</text><text x="24" y="214">QUESTIONS</text></g>
  <g font-size="13" fill="#1D2422" text-anchor="middle">
    <rect x="20" y="50" width="120" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="80" y="80" font-weight="bold">Documents</text><text x="80" y="99" fill="#5E6662" font-size="11">PDF · Markdown · texte</text>
    <rect x="165" y="50" width="140" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="235" y="80" font-weight="bold">Découpage</text><text x="235" y="99" fill="#5E6662" font-size="11">par section · page</text>
    <rect x="330" y="50" width="150" height="70" rx="8" fill="#fff" stroke="#C47A61" stroke-width="1.5"/><text x="405" y="80" font-weight="bold">Empreinte</text><text x="405" y="99" fill="#5E6662" font-size="11">inchangé → ignoré</text>
    <rect x="505" y="50" width="170" height="70" rx="8" fill="#315C5A"/><text x="590" y="80" font-weight="bold" fill="#fff">2 vecteurs</text><text x="590" y="99" fill="#E5DED3" font-size="11">sens (nomic) + mots-clés</text>
    <rect x="700" y="50" width="240" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="820" y="80" font-weight="bold">Qdrant</text><text x="820" y="99" fill="#5E6662" font-size="11">ancienne version remplacée</text>

    <rect x="20" y="230" width="120" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="80" y="260" font-weight="bold">Question</text><text x="80" y="279" fill="#5E6662" font-size="11">chat public</text>
    <rect x="165" y="230" width="140" height="70" rx="8" fill="#315C5A"/><text x="235" y="256" font-weight="bold" fill="#fff">Recherche hybride</text><text x="235" y="274" fill="#E5DED3" font-size="11">sens + mots-clés</text><text x="235" y="290" fill="#E5DED3" font-size="11">fusion RRF · 12</text>
    <rect x="330" y="230" width="150" height="70" rx="8" fill="#315C5A"/><text x="405" y="256" font-weight="bold" fill="#fff">Reclassement IA</text><text x="405" y="274" fill="#E5DED3" font-size="11">note de 0 à 3</text><text x="405" y="290" fill="#E5DED3" font-size="11">garde les 4 meilleurs</text>
    <rect x="505" y="230" width="170" height="70" rx="8" fill="#315C5A"/><text x="590" y="260" font-weight="bold" fill="#fff">Réponse sourcée</text><text x="590" y="279" fill="#E5DED3" font-size="11">[1] [2] dans le texte</text>
    <rect x="700" y="230" width="240" height="70" rx="8" fill="#fff" stroke="#C47A61" stroke-width="1.5"/><text x="820" y="256" font-weight="bold">Citations vérifiées</text><text x="820" y="274" fill="#5E6662" font-size="11">document · section · page</text><text x="820" y="290" fill="#5E6662" font-size="11">rien de pertinent → « je ne trouve pas »</text>
  </g>
  <g stroke="#315C5A" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 85H161"/><path d="M305 85H326"/><path d="M480 85H501"/><path d="M675 85H696"/>
    <path d="M140 265H161"/><path d="M305 265H326"/><path d="M480 265H501"/><path d="M675 265H696"/>
    <path d="M820 120V160C820 180 235 175 235 200V226" stroke-dasharray="4 4"/>
  </g>
  <text x="480" y="360" font-size="11" fill="#5E6662" text-anchor="middle">Tout tourne sur votre machine : documents, vecteurs, IA. Rien n'est envoyé à un service extérieur.</text>
</svg>
