<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="340" rx="12" fill="#F5F2EA"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315C5A"/></marker></defs>
  <g font-size="13" fill="#1D2422" text-anchor="middle">
    <rect x="20" y="50" width="120" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="80" y="84" font-weight="bold">Message</text><text x="80" y="102" fill="#5E6662" font-size="11">avec ses mots</text>
    <rect x="160" y="50" width="140" height="80" rx="8" fill="#315C5A"/><text x="230" y="80" font-weight="bold" fill="#fff">IA : quels droits ?</text><text x="230" y="98" fill="#E5DED3" font-size="11">accès, effacement,</text><text x="230" y="113" fill="#E5DED3" font-size="11">opposition…</text>
    <rect x="320" y="50" width="140" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="390" y="80" font-weight="bold">Registre</text><text x="390" y="98" fill="#5E6662" font-size="11">référence, échéance</text><text x="390" y="113" fill="#5E6662" font-size="11">légale d'un mois</text>
    <rect x="480" y="50" width="150" height="80" rx="8" fill="#fff" stroke="#C47A61" stroke-width="1.5"/><text x="555" y="80" font-weight="bold">Le demandeur</text><text x="555" y="98" fill="#5E6662" font-size="11">confirme par un lien</text><text x="555" y="113" fill="#5E6662" font-size="11">sinon : close à 7 jours</text>
    <rect x="650" y="50" width="140" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="720" y="80" font-weight="bold">Chaque outil</text><text x="720" y="98" fill="#5E6662" font-size="11">CRM, newsletter,</text><text x="720" y="113" fill="#5E6662" font-size="11">facturation</text>
    <rect x="810" y="50" width="130" height="80" rx="8" fill="#fff" stroke="#C47A61" stroke-width="1.5"/><text x="875" y="80" font-weight="bold">Le gérant</text><text x="875" y="98" fill="#5E6662" font-size="11">valide le plan</text><text x="875" y="113" fill="#5E6662" font-size="11">d'un clic</text>

    <rect x="250" y="200" width="200" height="70" rx="8" fill="#315C5A"/><text x="350" y="228" font-weight="bold" fill="#fff">Supprimer ou conserver</text><text x="350" y="246" fill="#E5DED3" font-size="11">pièces comptables : 10 ans</text>
    <rect x="470" y="200" width="200" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="570" y="228" font-weight="bold">Réponse au demandeur</text><text x="570" y="246" fill="#5E6662" font-size="11">+ copie de ses données</text>
    <rect x="690" y="200" width="200" height="70" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="790" y="228" font-weight="bold">Registre : traitée</text><text x="790" y="246" fill="#5E6662" font-size="11">trace des actions</text>
  </g>
  <g stroke="#315C5A" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 90H156"/><path d="M300 90H316"/><path d="M460 90H476"/><path d="M630 90H646"/><path d="M790 90H806"/>
    <path d="M875 130V165H350V196"/><path d="M450 235H466"/><path d="M670 235H686"/>
  </g>
  <text x="480" y="315" font-size="11" fill="#5E6662" text-anchor="middle">Chaque matin : rappel au gérant des demandes non closes dont l'échéance tombe dans les 7 jours.</text>
</svg>
