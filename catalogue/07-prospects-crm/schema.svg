<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="360" rx="12" fill="#F5F2EA"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#315C5A"/></marker></defs>
  <g font-size="13" fill="#1D2422" text-anchor="middle">
    <rect x="20" y="60" width="120" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="80" y="94" font-weight="bold">Demande</text><text x="80" y="112" fill="#5E6662" font-size="11">formulaire + RGPD</text>
    <rect x="165" y="60" width="160" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="245" y="88" font-weight="bold">API publiques</text><text x="245" y="106" fill="#5E6662" font-size="11">distance du chantier</text><text x="245" y="122" fill="#5E6662" font-size="11">registre des entreprises</text>
    <rect x="350" y="60" width="140" height="80" rx="8" fill="#315C5A"/><text x="420" y="94" font-weight="bold" fill="#fff">IA : le besoin</text><text x="420" y="112" fill="#E5DED3" font-size="11">note sur 40, local</text>
    <rect x="515" y="60" width="160" height="80" rx="8" fill="#fff" stroke="#C47A61" stroke-width="1.5"/><text x="595" y="88" font-weight="bold">Score sur 100</text><text x="595" y="106" fill="#5E6662" font-size="11">budget, délai, zone,</text><text x="595" y="122" fill="#5E6662" font-size="11">fiabilité : points fixes</text>
    <rect x="700" y="60" width="240" height="80" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="820" y="88" font-weight="bold">CRM, sans doublon</text><text x="820" y="106" fill="#5E6662" font-size="11">conservation : 3 ans après</text><text x="820" y="122" fill="#5E6662" font-size="11">le dernier échange</text>

    <rect x="160" y="200" width="150" height="60" rx="8" fill="#fff" stroke="#C0503A"/><text x="235" y="226" font-weight="bold">Chaud</text><text x="235" y="243" fill="#5E6662" font-size="11">alerte + brouillon</text>
    <rect x="330" y="200" width="150" height="60" rx="8" fill="#fff" stroke="#D9963B"/><text x="405" y="226" font-weight="bold">Tiède</text><text x="405" y="243" fill="#5E6662" font-size="11">fiche + brouillon</text>
    <rect x="500" y="200" width="170" height="60" rx="8" fill="#fff" stroke="#D8D2C5"/><text x="585" y="226" font-weight="bold">Froid ou hors zone</text><text x="585" y="243" fill="#5E6662" font-size="11">accusé de réception</text>
    <rect x="690" y="200" width="150" height="60" rx="8" fill="#fff" stroke="#D8D2C5" stroke-dasharray="4 3"/><text x="765" y="226" font-weight="bold">Spam</text><text x="765" y="243" fill="#5E6662" font-size="11">ni stocké ni répondu</text>
  </g>
  <g stroke="#315C5A" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 100H161"/><path d="M325 100H346"/><path d="M490 100H511"/><path d="M675 100H696"/>
    <path d="M820 140V170H235V196"/><path d="M405 170V196"/><path d="M585 170V196"/><path d="M765 170V196"/>
  </g>
  <text x="480" y="310" font-size="11" fill="#5E6662" text-anchor="middle">Purge RGPD chaque nuit : les fiches arrivées au terme de leur conservation sont supprimées, avec un compte rendu.</text>
  <text x="480" y="330" font-size="11" fill="#5E6662" text-anchor="middle">Le brouillon de réponse n'est jamais envoyé seul : le commercial le relit.</text>
</svg>
